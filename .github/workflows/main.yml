name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: production
    outputs:
      stamp: ${{ steps.push.outputs.stamp }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Mix production assets
        run: |
          echo "::group::npm ci"
          npm ci
          echo "::endgroup::"
          npm run production

      - name: Push deploy branch
        id: push
        env:
          TZ: Africa/Cairo
        run: |
          set -euo pipefail
          STAMP=$(date '+%Y-%m-%d %H:%M %Z')
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B deploy
          git add -f public/
          git commit --allow-empty -m "deploy: ${STAMP}"
          git push -f origin deploy
          SHA=$(git rev-parse --short HEAD)
          echo "stamp=${STAMP}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "## Build"
            echo "| | |"
            echo "|---|---|"
            echo "| SHA | \`${SHA}\` |"
            echo "| When | ${STAMP} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/domains/thanawyahelwa.org/public_html
            git fetch --prune origin
            git reset --hard origin/deploy
            chmod +x scripts/server-deploy.sh
            APP_DIR="$PWD" bash scripts/server-deploy.sh

      - name: Summary
        run: |
          {
            echo "## Live"
            echo "Released **${{ needs.build.outputs.sha }}** at ${{ needs.build.outputs.stamp }}."
          } >> "$GITHUB_STEP_SUMMARY"
